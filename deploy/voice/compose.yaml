# Dedicated Linux media host. Do not run beside another service binding 443.
services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--bind", "127.0.0.1", "--protected-mode", "yes"]
    network_mode: host
    restart: unless-stopped
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml", "--keys", "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"]
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]
    restart: unless-stopped
  proxy:
    image: caddy:2-alpine
    network_mode: host
    environment:
      VOICE_DOMAIN: ${VOICE_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - voice_caddy:/data
    restart: unless-stopped
volumes:
  voice_caddy:
