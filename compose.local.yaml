services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pairup
      POSTGRES_PASSWORD: pairup-local-only
      POSTGRES_DB: pairup
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pairup_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pairup -d pairup"]
      interval: 3s
      retries: 20
volumes:
  pairup_local_data:
